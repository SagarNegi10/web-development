<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Personal Inforamtion</legend>
            <label for="name">Name:</label>
            <input type="text" name="name" id="name">
            
            <label for="email">Email:</label>
            <input type="email" name="email" id="email">

            <label for="phone">Phone:</label>
            <input type="tel" name="phone" id="phone">

            <label for="dob">Date of Birth:</label>
            <input type="date" name="date" id="date">

            <span>Gender</span>
            <input type="radio" id="male" name="gender">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender">
            <label for="female">Female</label>

            <label for="country">Country:</label>
            <select name="country" id="country">
                <option value="india">India</option>
                <option value="usa">USA</option>
                <option value="japan">Japan</option>
                <option value="spain">Spain</option>
                <option value="france">France</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Addres</legend>
            <label for="street">Street:</label>
            <input type="text" name="street" id="street">

            <label for="city">City</label>
            <input type="text" name="city" id="city">

            <label for="state">State</label>
            <input type="text" name="state" id="state">

            <label for="zc">Zip Code</label>
            <input type="number" name="zc" id="zc">
        </fieldset>

        <fieldset>
            <legend>Other Inforamtion</legend>
            <label for="comments">Comments:</label>
            <textarea name="comments" id="comments" rows="10" cols="50"></textarea>

            <label for="terms">I agree to the terms of service</label>
            <input type="checkbox" name="terms" id="term">
        </fieldset>
        <button>Submit</button>
    </form>
</body>
</html>
